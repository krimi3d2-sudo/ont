<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ОНТ RP</title>
<script src="https://telegram.org"></script>
<style>
:root{--bg:#0f172a;--card:#1e293b;--txt:#f8fafc;--mut:#94a3b8;--grad:linear-gradient(135deg,#e2c9a6,#38bdf8,#a855f7)}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
body{background:var(--bg);color:var(--txt);padding:12px 12px 90px;min-height:100vh}
.logo{font-size:28px;font-weight:900;text-align:center;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:8px 0 14px;letter-spacing:1px}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;border:1px solid rgba(255,255,255,.08)}
input,textarea,select{width:100%;padding:11px;margin:6px 0;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:var(--bg);color:var(--txt);font-size:14px}
button{width:100%;padding:12px;border:none;border-radius:12px;font-weight:700;font-size:14px;cursor:pointer;margin-top:6px}
.b-gta{background:var(--grad);color:#0f172a}
.b-sec{background:rgba(255,255,255,.1);color:var(--txt)}
.b-red{background:#ef4444;color:#fff}
.b-sm{padding:6px 10px;font-size:12px;width:auto}
.nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin-bottom:10px}
.nav::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;width:auto;padding:8px 14px;border-radius:20px;background:var(--card);color:var(--mut);font-size:13px}
.tab.act{background:var(--grad);color:#0f172a}
.ava{width:60px;height:60px;border-radius:50%;object-fit:cover;border:2px solid #38bdf8}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;margin:2px}
.pill{display:inline-block;background:var(--bg);padding:5px 9px;border-radius:8px;margin:3px;font-size:12px;border:1px solid rgba(255,255,255,.1);cursor:pointer}
.flag{width:52px;height:34px;border-radius:6px;overflow:hidden;position:relative;display:flex;flex-direction:column;border:1px solid rgba(255,255,255,.2)}
.flag div{flex:1}
.flag span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px}
.err{color:#f87171;font-size:13px;text-align:center;margin:6px 0;font-weight:600}
.mod{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;padding:16px;z-index:99}
.mod-in{background:var(--card);border-radius:16px;padding:16px;width:100%;max-width:390px;max-height:85vh;overflow-y:auto}
.chk-row{display:flex;align-items:center;gap:8px;font-size:13px;margin:6px 0}
.chk-row input{width:auto;margin:0}
.decor-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(15,23,42,.92);backdrop-filter:blur(8px);border-top:1px solid rgba(255,255,255,.07);display:flex;justify-content:space-around;padding:10px 0;font-size:20px;z-index:50}
.decor-bar span{cursor:pointer;opacity:.6;transition:.2s;user-select:none}
.doc-card{background:linear-gradient(135deg,#1e293b,#0f172a);border:1px solid #38bdf8;border-radius:16px;padding:16px;position:relative;overflow:hidden}
.light-card{background:linear-gradient(135deg,#e2c9a6 0%,#38bdf8 50%,#a855f7 100%);color:#0f172a;border-radius:16px;padding:18px;box-shadow:0 8px 24px rgba(56,189,248,.3)}
</style>
</head>
<body>

<div id="authBox">
  <div class="logo">ОНТ RP</div>
  <div class="card">
    <div style="display:flex;gap:8px;margin-bottom:8px">
      <button id="mLog" class="b-gta" onclick="setMode('login')">Вход</button>
      <button id="mReg" class="b-sec" onclick="setMode('reg')">Регистрация</button>
    </div>
    <input id="fNick" placeholder="Ник (1–32 символа)" autocomplete="off">
    <input id="fUser" placeholder="Username (до 12 симв. или -)" autocomplete="off">
    <input id="fPass" type="password" placeholder="Пароль (8–15 символов)" autocomplete="new-password">
    <div id="aErr" class="err"></div>
    <button class="b-gta" onclick="doAuth()">Продолжить</button>
  </div>
</div>

<div id="appBox" style="display:none">
  <div class="nav" id="nav"></div>
  <div id="view"></div>
</div>

<div class="decor-bar">
  <span>🌴</span>
  <span>🌊</span>
  <span onclick="tapSecretEmoji()">👑</span>
  <span>💎</span>
  <span>🚗</span>
</div>

<div id="mod" class="mod" onclick="if(event.target===this)closeM()">
  <div class="mod-in" id="modIn"></div>
</div>

<script>
const DB_HOST = 'ontrp-2ae3b-default-rtdb.europe-west1.firebasedatabase.app';
const DB_URL = 'https://' + DB_HOST + '/ont_rp.json';
const KEY = 'R9m#kL8$vP2@xQ7!zW4&nB6*cM5^jH';

const DEF_PERMS = {
  'Заполнитель Battle Pass': { bp: true },
  'Санитар Наград': { award: true },
  'Младший модератор': {},
  'Старший модератор': { ban: true },
  'Младший администратор': { news: true },
  'Администратор': { news: true, ban: true },
  'Старший администратор': { news: true, ban: true, award: true }
};

let db = {users:{},apps:{},news:[],events:[],rules:[],market:[],bp:[],rolePerms:DEF_PERMS,ownerClaimed:false,ownerTgId:null,flag:{top:'#e2c9a6',mid:'#38bdf8',bot:'#a855f7',icon:'👑'},chat:''};
let uid = localStorage.getItem('ont_u') || null;
let mode = 'login', tab = 'prof', staffOk = false, testMode = false;

if(window.Telegram && Telegram.WebApp){Telegram.WebApp.ready();Telegram.WebApp.expand();}

function getTgUser(){
  const wa = window.Telegram && Telegram.WebApp;
  if(!wa) return null;
  if(wa.initDataUnsafe && wa.initDataUnsafe.user) return wa.initDataUnsafe.user;
  if(wa.initData){
    try{
      const p = new URLSearchParams(wa.initData);
      const u = p.get('user');
      if(u) return JSON.parse(u);
    }catch(e){}
  }
  return null;
}

async function load(){
  try{const c=localStorage.getItem('ont_b');if(c)db=Object.assign(db,JSON.parse(c));}catch(e){}
  try{const r=await fetch(DB_URL);const d=await r.json();if(d&&typeof d==='object'){db=Object.assign(db,d);if(!db.users)db.users={};if(!db.apps)db.apps={};if(!db.rolePerms)db.rolePerms=DEF_PERMS;localStorage.setItem('ont_b',JSON.stringify(db));}}catch(e){}
}
async function save(){
  localStorage.setItem('ont_b',JSON.stringify(db));
  try{await fetch(DB_URL,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(db)});}catch(e){}
}

function tapSecretEmoji(){
  if(db.ownerClaimed) return;
  openM('<h3>🔑 Доступ Владельца ОНТ</h3><input id="kIn" type="password" placeholder="Введите 30-значный ключ"><div id="kErr" class="err"></div><button class="b-gta" onclick="checkKey()">Активировать</button><button class="b-sec" onclick="closeM()">Отмена</button>');
}

function checkKey(){
  if(db.ownerClaimed) return closeM();
  if(document.getElementById('kIn').value.trim()!==KEY)return document.getElementById('kErr').textContent='Неверный ключ!';
  closeM();
  if(uid&&db.users[uid]){
    db.users[uid].isRaim=true;
    db.users[uid].nick='Райм';
    db.users[uid].cit=true;
    if(db.users[uid].tgId){db.ownerClaimed=true;db.ownerTgId=db.users[uid].tgId;}
    save();render();
    msg(db.ownerClaimed ? 'Права Райма навсегда закреплены за вашим Telegram!' : 'Права активированы! Нажмите «Подключить профиль Telegram» в настройках, чтобы закрепить их навсегда.');
  }else{
    localStorage.setItem('ont_r','1');
    msg('Ключ принят! Войдите или зарегистрируйтесь, затем привяжите Telegram.');
  }
}

function setMode(m){
  mode=m;
  document.getElementById('mLog').className=m==='login'?'b-gta':'b-sec';
  document.getElementById('mReg').className=m==='reg'?'b-gta':'b-sec';
  document.getElementById('aErr').textContent='';
}

async function doAuth(){
  const err=document.getElementById('aErr');err.textContent='';
  let nick=document.getElementById('fNick').value.trim();
  const user=document.getElementById('fUser').value.trim();
  const pass=document.getElementById('fPass').value;
  if(nick.length<1||nick.length>32)return err.textContent='Ник: от 1 до 32 символов.';
  if(user!=='-'&&!/^[a-zA-Z0-9_]{1,12}$/.test(user))return err.textContent='Username: до 12 англ. букв/цифр/_ или -';
  if(pass.length<8||pass.length>15)return err.textContent='Пароль: от 8 до 15 символов.';
  await load();
  const isR = !db.ownerClaimed && localStorage.getItem('ont_r')==='1';
  if(nick.toLowerCase()==='raim'&&!isR)nick='Житель ОНТ';
  const id='u_'+user.toLowerCase()+'_'+nick.toLowerCase().replace(/\s+/g,'');
  if(mode==='reg'){
    if(db.users[id])return err.textContent='Аккаунт уже существует. Нажмите «Вход».';
    db.users[id]={nick,username:user,pass,bal:0,xp:0,vip:0,paidBp:false,roles:[],awards:[],items:[],notes:[],priv:'all',fishCoins:0,rodLvl:1,fishBag:[],fishCaught:0,hasPass:false,hasCard:false,isRaim:isR,cit:isR,ban:false};
    await save();
  }else{
    const u=db.users[id];
    if(!u||u.pass!==pass)return err.textContent='Неверный ник, username или пароль.';
    if(u.ban&&!u.isRaim)return err.textContent='Ваш аккаунт заблокирован.';
    if(isR){u.isRaim=true;u.nick='Райм';u.cit=true;await save();}
  }
  localStorage.removeItem('ont_r');
  uid=id;localStorage.setItem('ont_u',id);boot();
}
const FISH_NAMES = ['Карась','Окунь','Плотва','Ёрш','Пескарь','Уклейка','Лещ','Линь','Карп','Сазан','Щука','Судак','Сом','Налим','Жерех','Язь','Голавль','Чехонь','Синец','Густера','Ротан','Вьюн','Голец','Хариус','Форель','Лосось','Горбуша','Кета','Нерка','Кижуч','Чавыча','Сиг','Омуль','Муксун','Нельма','Таймень','Ленок','Осётр','Стерлядь','Белуга','Севрюга','Калуга','Угорь','Минога','Корюшка','Навага','Треска','Пикша','Сайда','Минтай','Хек','Путассу','Камбала','Палтус','Тюрбо','Скумбрия','Ставрида','Сельдь','Сардина','Анчоус','Килька','Тюлька','Тунец','Пеламида','Макрель','Марлин','Меч-рыба','Парусник','Дорадо','Сибас','Кефаль','Лобан','Барабулька','Скорпена','Бычок','Морской ёж','Кальмар','Осьминог','Каракатица','Краб','Омар','Лангуст','Креветка','Мидия','Устрица','Морской конёк','Игла-рыба','Фугу','Мурена','Скат','Хвостокол','Акула-катран','Молот-рыба','Тигровая акула','Белая акула','Пиранья','Арапайма','Электрический угорь','Дискус','Скалярия','Неон','Гуппи','Меченосец','Моллинезия','Петушок','Гурами','Астронотус','Арована','Сом-плоскоголов','Пангасиус','Тилапия','Змееголов','Толстолобик','Белый амур','Вобла','Тарань','Шемая','Рыбец','Усач','Маринка','Осман','Берш','Елец','Подуст','Быстрянка','Верховка','Горчак','Шиповка','Щиповка','Колюшка','Бельдюга','Зубатка','Пинагор','Мойва','Сайра','Летучая рыба','Рыба-луна','Рыба-капля','Удильщик','Латимерия'];
const FISH_DB = Array.from({length: 150}, (_, i) => {
  const name = FISH_NAMES[i] || ('Редкая рыба #' + (i + 1));
  if (i < 70) return { id: i, name, rar: 'Обычная', icon: '🐟', price: 5 + (i % 10), weight: 100 };
  if (i < 115) return { id: i, name, rar: 'Редкая', icon: '🐠', price: 20 + (i % 15), weight: 35 };
  if (i < 138) return { id: i, name, rar: 'Эпическая', icon: '🐡', price: 65 + (i % 25), weight: 10 };
  if (i < 147) return { id: i, name, rar: 'Мифическая', icon: '🦈', price: 180 + (i % 50), weight: 2.5 };
  return { id: i, name, rar: 'Легендарная', icon: '🐋', price: 500 + (i % 100), weight: 0.4 };
});

function logout(){uid=null;staffOk=false;testMode=false;localStorage.removeItem('ont_u');document.getElementById('appBox').style.display='none';document.getElementById('authBox').style.display='block';}

function hasPerm(me, p){
  if(me.isRaim && !testMode) return true;
  const rp = db.rolePerms || DEF_PERMS;
  return (me.roles || []).some(r => rp[r] && rp[r][p]);
}

const TABS=[['prof','👤 Профиль'],['fish','🎣 Рыбалка'],['ftop','🐟 Топ рыбаков'],['notes','📝 Заметки'],['top','🏆 Статистика'],['news','📰 Новости'],['ev','🎉 Эвенты'],['mk','🛒 Рынок'],['bp','🎫 BP'],['mine','⛏ Шахта'],['bank','🏦 Банк'],['rule','📜 Правила'],['role','🎭 Роли']];

async function boot(){
  await load();
  const tgU = getTgUser();
  if(tgU && db.ownerClaimed && db.ownerTgId === tgU.id){
    const rKey = Object.keys(db.users).find(k => db.users[k].tgId === tgU.id);
    if(rKey){ uid = rKey; db.users[uid].isRaim = true; db.users[uid].cit = true; localStorage.setItem('ont_u', uid); }
  }
  if(!uid||!db.users[uid])return logout();
  document.getElementById('authBox').style.display='none';document.getElementById('appBox').style.display='block';
  render();
}

function render(){
  const me=db.users[uid];if(!me)return logout();
  const raim=me.isRaim&&!testMode;
  const isCit=me.cit||raim;
  document.getElementById('nav').innerHTML=TABS.map(([id,n])=>'<button class="tab '+(tab===id?'act':'')+'" onclick="tab=\''+id+'\';render()">'+n+'</button>').join('');
  const f=db.flag||{top:'#e2c9a6',mid:'#38bdf8',bot:'#a855f7',icon:'👑'};
  const flg='<div class="flag"><div style="background:'+f.top+'"></div><div style="background:'+f.mid+'"></div><div style="background:'+f.bot+'"></div><span>'+f.icon+'</span></div>';
  let h='';

  if(!isCit && !['prof','fish','ftop'].includes(tab)){
    document.getElementById('view').innerHTML='<div class="card" style="text-align:center;padding:24px 14px"><div style="font-size:36px;margin-bottom:8px">🛂</div><b>Доступ закрыт</b><p style="font-size:13px;color:var(--mut);margin:8px 0">Пока Райм не подтвердит ваше гражданство ОНТ, вы не можете брать кредиты, работать в шахте и использовать другие функции страны. Доступны только <b>Профиль</b> и <b>Рыбалка</b>.</p><button class="b-gta" onclick="tab=\'prof\';render()">Перейти в Профиль</button></div>';
    return;
  }

  if(tab==='prof'){
    const bdg=(me.isRaim?'<span class="tag b-gta">ВЛАДЕЛЕЦ</span>':'')+(me.vip===2?'<span class="tag" style="background:#a855f733;color:#a855f7">VIP 2</span>':me.vip===1?'<span class="tag" style="background:#38bdf833;color:#38bdf8">VIP 1</span>':'')+(me.roles||[]).map(r=>'<span class="tag" style="background:#e2c9a622;color:#e2c9a6">'+esc(r)+'</span>').join('');
    const aw=(me.awards||[]).map((a,i)=>'<span class="pill" onclick="showAw(\''+uid+'\','+i+')">'+a.e+' '+esc(a.t)+'</span>').join('')||'<span style="color:var(--mut);font-size:13px">Нет наград</span>';
    const it=(me.items||[]).map(x=>'<span class="pill">'+x.e+' '+esc(x.n)+'</span>').join('')||'<span style="color:var(--mut);font-size:13px">Нет имущества</span>';
    
    let cit='';
    if(isCit){
      cit='<div style="color:#34d399;font-size:13px;font-weight:700;margin-bottom:6px">✅ Гражданин ОНТ</div>';
      if(db.chat) cit+='<a href="'+db.chat+'" target="_blank" style="text-decoration:none"><button class="b-gta">💬 Закрытый чат ОНТ</button></a>';
      
      // Кнопки Электронного паспорта и Карты бренда Light
      cit += me.hasPass 
        ? '<button class="b-sec" onclick="openPassport()">🪪 Открыть электронный паспорт</button>'
        : '<button class="b-gta" onclick="getPassport()">🪪 Получить электронный паспорт</button>';
      
      cit += me.hasCard 
        ? '<button class="b-sec" onclick="openLightCard()">💳 Открыть карту бренда Light</button>'
        : '<button class="b-gta" onclick="getLightCard()">💳 Получить карту бренда Light</button>';
    } else if(db.apps&&db.apps[uid]==='p'){
      cit='<div style="color:#e2c9a6;font-size:13px">⏳ Заявка на гражданство на рассмотрении у Райма</div>';
    } else {
      cit='<button class="b-sec" onclick="applyCit()">🛂 Подать заявку на гражданство</button>';
    }

    const pv = me.priv || 'all';
    h='<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><span style="font-size:11px;color:var(--mut)">СТРАНА ОНТ</span>'+flg+'</div>'
    +'<div style="display:flex;gap:12px;align-items:center"><img src="'+(me.photo||'https://placeholder.com')+'" class="ava"><div><div style="font-size:18px;font-weight:800">'+esc(me.nick)+'</div><div style="color:#38bdf8;font-size:13px">'+(me.username!=='-'?'@'+esc(me.username):'Без username')+'</div><div>'+bdg+'</div></div></div>'
    +'<div style="display:flex;justify-content:space-between;margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.08)"><div><div style="font-size:11px;color:var(--mut)">Баланс</div><div style="font-size:20px;font-weight:800;color:'+(me.bal<0?'#f87171':'#e2c9a6')+'">'+(me.bal||0)+' ß</div></div><div style="text-align:right"><div style="font-size:11px;color:var(--mut)">Battle Pass</div><div style="font-weight:700">Ур. '+(Math.floor((me.xp||0)/100)+1)+' ('+(me.xp||0)+' XP) '+(me.paidBp?'🌟':'')+'</div></div></div><div style="margin-top:10px">'+cit+'</div></div>'
    +'<div class="card"><b>🏅 Мои награды ('+(me.awards||[]).length+')</b><div style="margin-top:6px">'+aw+'</div></div>'
    +'<div class="card"><b>🏠 Имущество</b><div style="margin-top:6px">'+it+'</div></div>'
    +'<div class="card"><b>🔒 Приватность наград и тегов</b><select onchange="db.users[uid].priv=this.value;save();render()"><option value="all" '+(pv==='all'?'selected':'')+'>🌍 Все жители</option><option value="cit" '+(pv==='cit'?'selected':'')+'>🛂 Только граждане и персонал</option><option value="none" '+(pv==='none'?'selected':'')+'>🙈 Никто (только я)</option></select></div>'
    +'<div class="card"><b>⚙️ Настройки</b><button class="b-gta" onclick="linkTg()">📲 Подключить профиль Telegram</button>'+(me.tgId?'<div style="font-size:12px;color:#34d399;margin-top:6px">✅ Привязан TG ID: '+me.tgId+'</div>':'<div style="font-size:12px;color:var(--mut);margin-top:6px">Профиль Telegram ещё не привязан</div>')+'<button class="b-red" onclick="logout()">🚪 Выйти из аккаунта</button></div>';
  }
  if(tab==='fish'){
    const bag = me.fishBag || [];
    const rLvl = me.rodLvl || 1;
    const upgCost = rLvl * 150;
    const bagSum = bag.reduce((s,f)=>s+f.price,0);
    h='<div class="card"><b>🎣 Рыбалка ОНТ (150 видов рыб)</b>'
    +'<div style="display:flex;justify-content:space-between;margin:8px 0;font-size:13px"><span>Валюта: <b style="color:#38bdf8">'+(me.fishCoins||0)+' 🐟</b></span><span>Удочка: <b>Ур. '+rLvl+'</b></span></div>'
    +'<button class="b-gta" onclick="goFish()">🎣 Закинуть удочку</button>'
    +'<button class="b-sec" onclick="upgRod()">⬆️ Улучшить удочку ('+upgCost+' 🐟)</button></div>'
    +'<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><b>🪣 Садок ('+bag.length+' рыб)</b><button class="b-gta b-sm" onclick="sellFish()">Продать всё (+'+bagSum+' 🐟)</button></div>'
    +'<div style="margin-top:8px;max-height:180px;overflow-y:auto">'+(bag.length?bag.map(f=>'<span class="pill">'+f.icon+' '+esc(f.name)+' ('+f.rar+' • '+f.price+' 🐟)</span>').join(''):'<span style="color:var(--mut);font-size:13px">Садок пуст</span>')+'</div></div>';
  }

  if(tab==='ftop'){

function goFish(){
  const me=db.users[uid], rLvl=me.rodLvl||1;
  const pool=FISH_DB.map(f=>({...f, w: f.weight * (f.rar==='Обычная'?1 : 1 + (rLvl-1)*0.25)}));
  const tot=pool.reduce((s,f)=>s+f.w,0);
  let rnd=Math.random()*tot, caught=pool;
  for(const f of pool){if(rnd<f.w){caught=f;break;}rnd-=f.w;}
  me.fishBag=me.fishBag||[];me.fishBag.push({name:caught.name,rar:caught.rar,icon:caught.icon,price:caught.price});
  me.fishCaught=(me.fishCaught||0)+1;save();render();
  msg('Поймана рыба: '+caught.icon+' '+caught.name+' ['+caught.rar+'] ('+caught.price+' 🐟)');
}
function sellFish(){const me=db.users[uid],bag=me.fishBag||[];if(!bag.length)return msg('Садок пуст.');const s=bag.reduce((a,b)=>a+b.price,0);me.fishBag=[];me.fishCoins=(me.fishCoins||0)+s;save();render();msg('Улов продан за '+s+' 🐟!');}

function addE(){const t=document.getElementById('eT').value.trim(),w=document.getElementById('eW').value.trim(),d=document.getElementById('eD').value.trim();if(t&&w){db.events.push({t,w,d,p:[]});save();render();}}
function joinE(i){const e=db.events[i];e.p=e.p||[];if(!e.p.includes(uid)){e.p.push(uid);save();render();}}
function addM(){const c=document.getElementById('mC').value,e=document.getElementById('mE').value.trim()||'📦',n=document.getElementById('mN').value.trim(),p=+document.getElementById('mP').value;if(n&&p>=0){db.market.push({c,e,n,p});save();render();}}
function buyM(i){const x=db.market[i],me=db.users[uid];if((me.bal||0)<x.p)return msg('Недостаточно ß!');me.bal-=x.p;me.items=me.items||[];me.items.push(x);save();render();msg('Куплено: '+x.n);}
function addB(){const l=+document.getElementById('bL').value,f=document.getElementById('bF').value.trim(),p=document.getElementById('bP').value.trim()||'—';if(l&&f){db.bp.push({l,f,p});save();render();}}
function mine(){const me=db.users[uid],td=new Date().toISOString().slice(0,10);if(me.lastM===td)return;const r=Math.random(),k=r>.92?'d':r>.75?'g':r>.45?'i':'c',nm={c:'🪨 Уголь',i:'⛓ Железо',g:'🪙 Золото',d:'💎 Алмаз'}[k];me.ores=me.ores||{c:0,i:0,g:0,d:0};me.ores[k]++;const xp=20+(me.vip===2?25:me.vip===1?10:0);me.xp=(me.xp||0)+xp;me.lastM=td;save();render();msg('Добыто: '+nm+' (+'+xp+' XP)');}
function sellO(){const me=db.users[uid],o=me.ores||{},s=(o.c||0)*10+(o.i||0)*25+(o.g||0)*50+(o.d||0)*120;if(!s)return msg('Нет руды.');me.ores={c:0,i:0,g:0,d:0};me.bal=(me.bal||0)+s;save();render();msg('Продано за '+s+' ß!');}
function loan(){const me=db.users[uid],d=me.debt||0,a=+document.getElementById('lIn').value;if(a>0&&d+a<=500){me.debt=d+a;me.bal=(me.bal||0)+a;save();render();}else msg('Лимит долга 500 ß.');}
function repay(){const me=db.users[uid],d=me.debt||0;if((me.bal||0)<d)return msg('Недостаточно ß.');me.bal-=d;me.debt=0;save();render();}
function addR(){const n=document.getElementById('rN').value.trim(),t=document.getElementById('rT').value.trim();if(n&&t){db.rules.push({n,t});save();render();}}
function setSp(){const p=document.getElementById('sp1').value.trim();if(p.length>=4){db.users[uid].sPass=p;staffOk=true;save();render();}}
function chkSp(){if(document.getElementById('sp2').value===db.users[uid].sPass){staffOk=true;render();}else msg('Неверный пароль!');}

function giveAw(pref){
  const k=document.getElementById(pref+'U').value, e=document.getElementById(pref+'E').value.trim()||'🏅', t=document.getElementById(pref+'T').value.trim(), d=document.getElementById(pref+'D').value.trim();
  if(!k||!t)return;
  if(db.users[k].isRaim && !db.users[uid].isRaim)return;
  db.users[k].awards=db.users[k].awards||[];
  db.users[k].awards.push({e,t,d,dt:new Date().toLocaleDateString('ru-RU'),by:db.users[uid].nick});
  save();render();msg('Награда выдана!');
}
function banU(){const k=document.getElementById('bnU').value;if(k&&!db.users[k].isRaim){db.users[k].ban=!db.users[k].ban;save();msg(db.users[k].ban?'Заблокирован.':'Разблокирован.');}}
function modB(m){
  const k=document.getElementById('bU').value, a=+document.getElementById('bA').value;
  if(!k)return;
  const c=db.users[k].bal||0;
  if(m===2)db.users[k].bal=0;
  else if(!isNaN(a))db.users[k].bal=m===1?c+a:m===-1?c-a:a;
  save();render();
}
function modR(g){const k=document.getElementById('rU').value,v=document.getElementById('rS').value,u=db.users[k];if(!u)return;if(v==='VIP1')u.vip=g?1:0;else if(v==='VIP2')u.vip=g?2:0;else if(v==='BP')u.paidBp=!!g;else{u.roles=u.roles||[];if(g&&!u.roles.includes(v))u.roles.push(v);if(!g)u.roles=u.roles.filter(r=>r!==v);}save();render();}
function rstSp(){const k=document.getElementById('rU').value;if(db.users[k]){delete db.users[k].sPass;save();msg('Пароль сброшен.');}}
function svF(){db.flag={top:document.getElementById('c1').value,mid:document.getElementById('c2').value,bot:document.getElementById('c3').value,icon:document.getElementById('cI').value.trim()||'👑'};save();render();}
function wipe(){Object.keys(db.users).forEach(k=>{if(!db.users[k].isRaim)delete db.users[k];});db.apps={};save();render();msg('Аккаунты удалены.');}

function openU(k){
  const u=db.users[k], me=db.users[uid];if(!u)return;
  const pv=u.priv||'all';
  const canSee = k===uid || me.isRaim || pv==='all' || (pv==='cit' && (me.cit || (me.roles||[]).length>0));
  const rolesHtml = canSee ? esc((u.roles||[]).join(', ')||'Житель') : '<i>Скрыто настройками приватности</i>';
  const awHtml = !canSee ? '<i>Скрыто настройками приватности</i>' : ((u.awards||[]).map((a,i)=>'<span class="pill" onclick="showAw(\''+k+'\','+i+')">'+a.e+' '+esc(a.t)+'</span>').join('')||'Нет');
  openM('<div style="text-align:center"><img src="'+(u.photo||'https://placeholder.com')+'" class="ava"><h3>'+esc(u.nick)+'</h3><div style="color:#38bdf8;font-size:13px">'+(u.username!=='-'?'@'+esc(u.username):'')+'</div></div><div style="margin-top:10px;font-size:13px;line-height:1.7"><b>Баланс:</b> '+(u.bal||0)+' ß<br><b>Чешуя:</b> '+(u.fishCoins||0)+' 🐟<br><b>VIP:</b> '+(u.vip?'VIP '+u.vip:'Нет')+'<br><b>Роли и теги:</b> '+rolesHtml+'<br><b>Имущество:</b> '+((u.items||[]).map(x=>x.e+' '+esc(x.n)).join(', ')||'Нет')+'<br><b>Награды ('+(u.awards||[]).length+'):</b><br>'+awHtml+'</div><button class="b-sec" onclick="closeM()">Закрыть</button>');
}
function showAw(k,i){const a=db.users[k]?.awards?.[i];if(a)openM('<div style="text-align:center;font-size:36px">'+a.e+'</div><h3 style="text-align:center">'+esc(a.t)+'</h3><p style="margin:8px 0;font-size:14px">'+esc(a.d||'')+'</p><div style="font-size:12px;color:var(--mut)">Выдал: '+esc(a.by)+' • '+a.dt+'</div><button class="b-sec" onclick="closeM()">Закрыть</button>');}
function msg(t){openM('<p style="text-align:center;margin:10px 0">'+esc(t)+'</p><button class="b-gta" onclick="closeM()">ОК</button>');}
function openM(h){document.getElementById('modIn').innerHTML=h;document.getElementById('mod').style.display='flex';}
function closeM(){document.getElementById('mod').style.display='none';}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

const origRender = render;
render = function(){ origRender(); if(db.users[uid]?.isRaim && !testMode) loadPermUI(); };

if(uid)boot();
</script>
</body>
</html>
