<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>РП Страна ОНТ</title><script src="https://telegram.org"></script><style>:root{--bg:#0f172a;--card:#1e293b;--text:#f8fafc;--muted:#94a3b8;--accent:#38bdf8;--gold:#f59e0b;--success:#10b981;--danger:#ef4444;--purple:#a855f7}body{font-family:sans-serif;background:var(--bg);color:var(--text);margin:0;padding:12px;display:flex;justify-content:center;min-height:100vh}.box{width:100%;max-width:480px;background:var(--card);border-radius:16px;padding:18px;border:1px solid #334155}.hidden{display:none!important}.hdr{display:flex;align-items:center;gap:10px;margin-bottom:12px}.ava{width:50px;height:50px;border-radius:50%;background:#38bdf8;display:flex;align-items:center;justify-content:center;font-weight:bold;overflow:hidden;flex-shrink:0}.ava img{width:100%;height:100%;object-fit:cover}.flg{width:44px;height:28px;border-radius:5px;overflow:hidden;border:1px solid #475569;position:relative;display:flex;flex-direction:column;flex-shrink:0}.flg div{flex:1}.flg span{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:13px}.bdg{padding:2px 7px;border-radius:10px;font-size:10px;font-weight:700;background:#334155;color:var(--muted);display:inline-block;margin:2px 2px 0 0}.bdg.c{background:rgba(16,185,129,.2);color:var(--success);border:1px solid var(--success)}.bdg.r{background:rgba(245,158,11,.2);color:var(--gold);border:1px solid var(--gold)}.bdg.v1{background:rgba(56,189,248,.2);color:var(--accent)}.bdg.v2{background:rgba(168,85,247,.25);color:#d8b4fe}.bdg.a{background:rgba(239,68,68,.2);color:var(--danger)}.bal{background:#0f172a;padding:12px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;border:1px solid #334155}.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px;border-bottom:1px solid #334155}.tb{background:#0f172a;color:var(--muted);border:1px solid #334155;padding:6px 9px;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap}.tb.act{background:var(--accent);color:#0f172a}.pnl{background:#0f172a;padding:12px;border-radius:12px;border:1px solid #334155;margin-bottom:10px}.btn{width:100%;padding:10px;border-radius:9px;border:none;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:7px;color:#fff;background:#2563eb}.btn-tg{background:#24A1DE}.btn-g{background:#f59e0b;color:#0f172a}.btn-p{background:#9333ea}.btn-d{background:#ef4444}.btn-s{background:#10b981;color:#0f172a}.btn:disabled{background:#334155;color:var(--muted)}input,select,textarea{width:100%;box-sizing:border-box;padding:8px 10px;border-radius:8px;border:1px solid #475569;background:#1e293b;color:#fff;font-size:13px;margin-bottom:7px}input[type=color]{padding:2px;height:34px}.row{display:flex;gap:6px}.it{display:flex;justify-content:space-between;align-items:center;padding:8px;background:#1e293b;border-radius:8px;margin-bottom:5px;border:1px solid #334155;font-size:12px}.mdl{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;justify-content:center;align-items:center;z-index:99;padding:14px}.mc{background:var(--card);padding:18px;border-radius:14px;width:100%;max-width:390px;border:1px solid var(--accent);max-height:85vh;overflow-y:auto}</style></head>
<body><div class="box"><div id="scr-auth" style="text-align:center;padding:20px 0;"><h2>🏛️ РП Страна ОНТ</h2><p style="color:var(--muted);font-size:13px;">Нажмите кнопку ниже для входа в профиль:</p><button class="btn btn-tg" onclick="doLogin()">✈️ Войти в аккаунт</button></div><div id="scr-ban" class="hidden" style="text-align:center;padding:20px 0;"><h2>⛔ Профиль заблокирован</h2></div><div id="scr-app" class="hidden"><button id="bar-test" class="btn btn-g hidden" onclick="toggleTest()">👑 Вернуться в Райма</button><div class="hdr"><div class="ava" id="u-ava">?</div><div style="flex:1;"><h3 id="u-name" style="margin:0;">Игрок</h3><div id="u-roles"></div></div><div class="flg"><div id="f1"></div><div id="f2"></div><div id="f3"></div><span id="fe">🦅</span></div></div><div class="bal"><div><div style="font-size:11px;color:var(--muted);">Долг: <span id="u-debt" style="color:var(--danger);">0</span> ß</div><div style="font-size:20px;font-weight:bold;color:var(--gold);"><span id="u-bal">0</span> ß</div></div><div style="font-size:24px;">🪙</div></div>
<div class="tabs"><button class="tb act" onclick="tab('m',this)">👤 Профиль</button><button class="tb" onclick="tab('t',this)">🏆 Топ</button><button class="tb" onclick="tab('n',this)">📢 Новости</button><button class="tb" onclick="tab('e',this)">🎉 Эвенты</button><button class="tb" onclick="tab('r',this)">⚖️ Правила</button><button class="tb" onclick="tab('p',this)">🏠 Рынок</button><button class="tb" onclick="tab('b',this)">🎖️ БП</button><button class="tb" onclick="tab('s',this)">⛏️ Шахта</button><button class="tb" onclick="tab('k',this)">🏦 Банк</button></div><div id="t-m"><div id="chat-ok" class="pnl hidden"><a id="chat-lnk" href="#" target="_blank" class="btn btn-tg" style="display:block;text-align:center;text-decoration:none;margin:0">💬 Войти в чат ОНТ</a></div><div id="chat-no" class="pnl hidden" style="font-size:12px;color:var(--muted);text-align:center">🔒 Чат доступен после одобрения гражданства</div><button id="btn-stf" class="btn btn-g hidden" onclick="unlkStf()">🔐 Пароль сотрудника</button><div class="pnl"><div style="font-size:11px;color:var(--muted);margin-bottom:6px">НАГРАДЫ И ИМУЩЕСТВО</div><div id="u-rew"></div><div id="u-prp" style="margin-top:6px"></div></div><button class="btn" id="btn-cit" onclick="reqCit()">Подать заявку на гражданство</button><div class="pnl"><div style="font-size:11px;color:var(--muted);margin-bottom:6px">ЖИТЕЛИ</div><div id="u-list"></div></div><div id="p-awd" class="pnl hidden"><select id="s-awd"></select><div class="row"><input id="i-ae" placeholder="🏅" style="width:30%"><input id="i-at" placeholder="Название"></div><button class="btn" onclick="giveRew()">Выдать награду</button></div><div id="p-mod" class="pnl hidden"><select id="s-ban"></select><button class="btn btn-d" onclick="togBan()">Бан / Разбан</button></div><div id="p-raim" class="pnl hidden" style="border-color:var(--gold)"><div style="color:var(--gold);font-size:12px;font-weight:bold;margin-bottom:6px">👑 ПАНЕЛЬ РАЙМА</div><div id="req-list"></div><select id="s-mng"></select><div class="row"><input type="number" id="i-beti" placeholder="Сумма ß" style="width:45%"><button class="btn btn-s" onclick="modB(1)">+</button><button class="btn btn-d" onclick="modB(-1)">-</button><button class="btn btn-g" onclick="modB(0)">=</button></div><div class="row"><button class="btn" onclick="setVip(1)">VIP 1</button><button class="btn btn-p" onclick="setVip(2)">VIP 2</button><button class="btn" style="background:#334155" onclick="setVip(0)">Снять</button></div><button class="btn btn-p" onclick="togBp()">Платный БП</button><select id="s-rol"><option value="bp_editor">Заполнитель БП</option><option value="sanitar">Санитар Наград</option><option value="jr_mod">Мл. Модер</option><option value="sr_mod">Ст. Модер</option><option value="jr_admin">Мл. Админ</option><option value="admin">Админ</option><option value="sr_admin">Ст. Админ</option></select><button class="btn" onclick="togRol()">Выдать / Снять роль</button><div class="row"><input type="color" id="fc1" value="#ffffff"><input type="color" id="fc2" value="#2563eb"><input type="color" id="fc3" value="#ef4444"><input id="fe-in" placeholder="🦅" style="width:35%"></div><button class="btn btn-g" onclick="savFlg()">Сохранить флаг</button><input id="i-lnk" placeholder="Ссылка на чат (https://t.me+...)"><div class="row"><button class="btn btn-g" onclick="setChat(1)">Привязать чат</button><button class="btn" style="background:#334155" onclick="setChat(0)">Отвязать</button></div><div class="row"><button class="btn" onclick="toggleTest()">🧪 Тест</button><button class="btn btn-d" onclick="wipeAll()">🗑️ Сброс чужих</button></div></div></div>
<div id="t-t" class="hidden"><div class="pnl"><div style="font-size:12px;margin-bottom:8px">Казна жителей: <b id="tot-b" style="color:var(--gold)">0</b> ß</div><div id="top-l"></div></div></div><div id="t-n" class="hidden"><div id="c-n" class="pnl hidden"><input id="in-nt" placeholder="Заголовок"><textarea id="in-nx" placeholder="Текст"></textarea><button class="btn" onclick="addPost('news')">Опубликовать</button></div><div id="l-n"></div></div><div id="t-e" class="hidden"><div id="c-e" class="pnl hidden"><input id="in-et" placeholder="Эвент"><input id="in-em" placeholder="Время"><button class="btn btn-g" onclick="addPost('events')">Создать эвент</button></div><div id="l-e"></div></div><div id="t-r" class="hidden"><div id="c-r" class="pnl hidden"><input id="in-rn" placeholder="Пункт (1.1)"><input id="in-rx" placeholder="Правило"><button class="btn btn-g" onclick="addPost('rules')">Добавить</button></div><div id="l-r"></div></div><div id="t-p" class="hidden"><div id="c-p" class="pnl hidden"><div class="row"><input id="in-pe" placeholder="🚗" style="width:25%"><input id="in-pn" placeholder="Название"><input type="number" id="in-pp" placeholder="Цена" style="width:35%"></div><button class="btn btn-g" onclick="addPrp()">В магазин</button></div><div id="l-p"></div></div><div id="t-b" class="hidden"><div class="pnl">Опыт: <b id="u-xp">0</b> XP | <b id="u-bps">Бесплатный</b><div id="c-b" class="hidden" style="margin-top:8px"><div class="row"><input type="number" id="in-bl" placeholder="Ур" style="width:25%"><select id="in-bt"><option value="free">Бесплатный</option><option value="paid">Платный</option></select></div><input id="in-bi" placeholder="Награда / @тег"><button class="btn btn-g" onclick="addBp()">Добавить</button></div></div><div id="l-b"></div></div><div id="t-s" class="hidden"><div class="pnl" style="text-align:center"><button class="btn btn-g" id="btn-mine" onclick="mine()">⛏️ Добыть руду (1 раз/день)</button><div id="l-inv"></div></div></div><div id="t-k" class="hidden"><div class="pnl"><div class="row"><input type="number" id="in-ln" placeholder="Сумма до 500"><button class="btn" onclick="loan(1)">Взять</button></div><button class="btn btn-s" onclick="loan(0)">Погасить долг</button></div></div><button class="btn" style="background:#334155;margin-top:10px" onclick="logout()">🚪 Выйти из профиля</button></div></div><div id="m-raim" class="mdl hidden"><div class="mc"><h3 style="color:var(--gold);margin-top:0">Код Райма</h3><input type="password" id="in-rkey" placeholder="30-значный ключ"><div class="row"><button class="btn btn-g" onclick="verRaim()">ОК</button><button class="btn" style="background:#334155" onclick="document.getElementById('m-raim').classList.add('hidden')">Отмена</button></div></div></div>
<script>const KEY='R9m#kL8$vP2@xQ7!zW4&nB6*cM5^jH',FB='https://firebaseio.com{bp_editor:'БП',sanitar:'Санитар',jr_mod:'Мл.Модер',sr_mod:'Ст.Модер',jr_admin:'Мл.Админ',admin:'Админ',sr_admin:'Ст.Админ'},ORES=[{n:'🪨 Уголь',p:25},{n:'⛓️ Железо',p:50},{n:'🥇 Золото',p:100},{n:'💎 Алмаз',p:200}];let db=JSON.parse(localStorage.getItem('ont_v9'))||{raim:null,chat:'',flag:{c1:'#ffffff',c2:'#2563eb',c3:'#ef4444',em:'🦅'},news:[],events:[],rules:[],props:[{id:'1',e:'🚗',n:'Lada Vesta',p:300}],bp:[{l:1,t:'free',i:'50 ß',x:50}],users:{}},uid=localStorage.getItem('ont_u9')||null,tst=false,stf=false;const save=()=>{Object.values(db.users).forEach(u=>{if(u.n.toLowerCase()==='raim'&&u.id!==db.raim&&!tst)u.n='Житель';});localStorage.setItem('ont_v9',JSON.stringify(db));if(!tst)fetch(FB,{method:'PUT',body:JSON.stringify(db)}).catch(()=>{});};const sync=async()=>{try{let r=await fetch(FB),d=await r.json();if(d&&d.users){let rr=d.raim;db=d;if(tst&&uid===rr)db.raim='x';localStorage.setItem('ont_v9',JSON.stringify(db));draw();}}catch(e){}};function doLogin(){let u=window.Telegram?.WebApp?.initDataUnsafe?.user,id=u?String(u.id):(localStorage.getItem('ont_dev')||'tg_'+Math.floor(1e5+Math.random()*9e5)),nm=u?(u.first_name+(u.last_name?' '+u.last_name:'')):(db.users[id]?.n||'Житель ОНТ');localStorage.setItem('ont_dev',id);if(nm.toLowerCase()==='raim'&&db.raim&&id!==db.raim)nm='Житель ОНТ';if(!db.users[id])db.users[id]={id,n:nm,b:0,d:0,x:0,v:0,pb:false,cit:false,req:false,ban:false,r:[],rew:[],prp:[],inv:[],lm:'',sp:''};uid=id;localStorage.setItem('ont_u9',id);stf=false;save();draw();}function logout(){uid=null;stf=false;localStorage.removeItem('ont_u9');draw();}let tc=0;document.body.onclick=e=>{if(['INPUT','BUTTON','SELECT','TEXTAREA'].includes(e.target.tagName))return;if(++tc===3){tc=0;if(uid&&!db.raim)document.getElementById('m-raim').classList.remove('hidden');}setTimeout(()=>tc=0,600);};function verRaim(){if(document.getElementById('in-rkey').value.trim()===KEY&&!db.raim){db.raim=uid;db.users[uid].n='raim';save();document.getElementById('m-raim').classList.add('hidden');draw();}}function tab(t,b){['m','t','n','e','r','p','b','s','k'].forEach(x=>document.getElementById('t-'+x).classList.add('hidden'));document.getElementById('t-'+t).classList.remove('hidden');document.querySelectorAll('.tb').forEach(x=>x.classList.remove('act'));b.classList.add('act');}function unlkStf(){let u=db.users[uid];if(!u.sp){let p=prompt('Новый пароль:');if(p&&p.length>2){u.sp=p;stf=true;save();draw();}}else if(prompt('Пароль:')===u.sp){stf=true;draw();}}function draw(){if(!uid||!db.users[uid]){document.getElementById('scr-auth').classList.remove('hidden');document.getElementById('scr-app').classList.add('hidden');return;}let u=db.users[uid],ir=db.raim===uid;document.getElementById('scr-auth').classList.add('hidden');if(u.ban&&!ir){document.getElementById('scr-app').classList.add('hidden');document.getElementById('scr-ban').classList.remove('hidden');return;}document.getElementById('scr-ban').classList.add('hidden');document.getElementById('scr-app').classList.remove('hidden');document.getElementById('bar-test').classList.toggle('hidden',!tst);document.getElementById('u-name').innerText=u.n+(ir?' 👑':'');document.getElementById('u-ava').innerText=u.n;document.getElementById('u-bal').innerText=u.b;document.getElementById('u-debt').innerText=u.d;document.getElementById('u-xp').innerText=u.x;document.getElementById('u-bps').innerText=(u.pb||ir)?'Платный':'Бесплатный';let f=db.flag;document.getElementById('f1').style.background=f.c1;document.getElementById('f2').style.background=f.c2;document.getElementById('f3').style.background=f.c3;document.getElementById('fe').innerText=f.em;document.getElementById('u-roles').innerHTML=(ir?'<span class="bdg r">👑 Райм</span>':'')+(u.v===2?'<span class="bdg v2">VIP II</span>':u.v===1?'<span class="bdg v1">VIP I</span>':'')+(u.r||[]).map(x=>'<span class="bdg a">'+(RN[x]||x)+'</span>').join('')+(u.cit?'<span class="bdg c">Гражданин</span>':'<span class="bdg">Гость</span>');document.getElementById('chat-ok').classList.toggle('hidden',!(db.chat&&(u.cit||ir)));document.getElementById('chat-no').classList.toggle('hidden',!(db.chat&&!u.cit&&!ir));if(db.chat)document.getElementById('chat-lnk').href=db.chat;let cb=document.getElementById('btn-cit');cb.innerText=u.cit?'Вы гражданин ОНТ':u.req?'⏳ Заявка отправлена':'Подать заявку на гражданство';cb.disabled=u.cit||u.req;let act=ir||stf,rl=u.r||[];document.getElementById('btn-stf').classList.toggle('hidden',!(!ir&&rl.length&&!stf));document.getElementById('p-awd').classList.toggle('hidden',!(act&&(ir||rl.includes('sanitar'))));document.getElementById('p-mod').classList.toggle('hidden',!(act&&(ir||rl.some(x=>['sr_admin','admin','jr_admin','sr_mod'].includes(x)))));document.getElementById('c-n').classList.toggle('hidden',!(act&&(ir||rl.some(x=>['sr_admin','admin','jr_admin'].includes(x)))));document.getElementById('c-b').classList.toggle('hidden',!(act&&(ir||rl.includes('bp_editor'))));['p-raim','c-e','c-r','c-p'].forEach(x=>document.getElementById(x).classList.toggle('hidden',!ir));let all=Object.values(db.users);document.getElementById('u-list').innerHTML=all.map(x=>'<div class="it"><span>'+x.n+(x.id===db.raim?' 👑':'')+'</span><b>'+x.b+' ß</b></div>').join('');document.getElementById('tot-b').innerText=all.reduce((a,b)=>a+b.b,0);document.getElementById('top-l').innerHTML=all.slice().sort((a,b)=>b.b-a.b).map((x,i)=>'<div class="it"><span>#'+(i+1)+' '+x.n+'</span><b>'+x.b+' ß</b></div>').join('');['s-awd','s-ban','s-mng'].forEach(s=>{document.getElementById(s).innerHTML=all.map(x=>'<option value="'+x.id+'">'+x.n+'</option>').join('');});document.getElementById('req-list').innerHTML=all.filter(x=>x.req&&!x.cit).map(x=>'<div class="it"><span>'+x.n+'</span><div><button onclick="decCit(\''+x.id+'\',1)">✅</button><button onclick="decCit(\''+x.id+'\',0)">❌</button></div></div>').join('');document.getElementById('u-rew').innerHTML=(u.rew||[]).map(x=>'<span class="bdg">'+x+'</span>').join('')||'Нет наград';document.getElementById('u-prp').innerHTML=(u.prp||[]).map(x=>'<span class="bdg c">'+x+'</span>').join('')||'Нет имущества';document.getElementById('l-n').innerHTML=(db.news||[]).map(x=>'<div class="pnl"><b>'+x.t+'</b><p style="margin:4px 0;font-size:12px">'+x.x+'</p></div>').join('');document.getElementById('l-e').innerHTML=(db.events||[]).map(x=>'<div class="pnl"><b>🎉 '+x.t+'</b> ('+x.x+')</div>').join('');document.getElementById('l-r').innerHTML=(db.rules||[]).map(x=>'<div class="pnl"><b>§ '+x.t+'</b>: '+x.x+'</div>').join('');document.getElementById('l-p').innerHTML=(db.props||[]).map(x=>'<div class="it"><span>'+x.e+' '+x.n+'</span><button class="btn btn-g" style="width:auto;margin:0;padding:4px 8px" onclick="buy(\''+x.id+'\')">'+x.p+' ß</button></div>').join('');document.getElementById('l-b').innerHTML=(db.bp||[]).map(x=>'<div class="it"><span>Ур.'+x.l+' ('+x.t+'): '+x.i+'</span><b>'+x.x+' XP</b></div>').join('');document.getElementById('l-inv').innerHTML=(u.inv||[]).map((x,i)=>'<div class="it"><span>'+x.n+'</span><button class="btn btn-g" style="width:auto;margin:0;padding:4px 8px" onclick="sell('+i+')">+'+x.p+' ß</button></div>').join('');}
function reqCit(){db.users[uid].req=true;save();draw();}function decCit(id,ok){db.users[id].req=false;if(ok)db.users[id].cit=true;save();draw();}function giveRew(){let id=document.getElementById('s-awd').value,v=document.getElementById('i-ae').value+' '+document.getElementById('i-at').value;if(id!==db.raim||uid===db.raim){db.users[id].rew.push(v);save();draw();}}function togBan(){let id=document.getElementById('s-ban').value;if(id!==db.raim){db.users[id].ban=!db.users[id].ban;save();draw();}}function modB(m){let id=document.getElementById('s-mng').value,v=parseInt(document.getElementById('i-beti').value)||0;if(m===1)db.users[id].b+=v;else if(m===-1)db.users[id].b=Math.max(0,db.users[id].b-v);else db.users[id].b=v;save();draw();}function setVip(v){db.users[document.getElementById('s-mng').value].v=v;save();draw();}function togBp(){let id=document.getElementById('s-mng').value;db.users[id].pb=!db.users[id].pb;save();draw();}function togRol(){let id=document.getElementById('s-mng').value,r=document.getElementById('s-rol').value;if(id===db.raim)return;let u=db.users[id];u.r=u.r.includes(r)?u.r.filter(x=>x!==r):[...u.r,r];save();draw();}function savFlg(){db.flag={c1:document.getElementById('fc1').value,c2:document.getElementById('fc2').value,c3:document.getElementById('fc3').value,em:document.getElementById('fe-in').value||'🦅'};save();draw();}function setChat(on){db.chat=on?document.getElementById('i-lnk').value.trim():'';save();draw();}function addPost(k){let p=k==='news'?'n':k==='events'?'e':'r';db[k].push({t:document.getElementById('in-'+p+(k==='rules'?'n':'t')).value,x:document.getElementById('in-'+p+(k==='events'?'m':'x')).value});save();draw();}function addPrp(){db.props.push({id:String(Date.now()),e:document.getElementById('in-pe').value||'🏠',n:document.getElementById('in-pn').value,p:parseInt(document.getElementById('in-pp').value)||0});save();draw();}function buy(id){let p=db.props.find(x=>x.id===id),u=db.users[uid];if(u.b>=p.p){u.b-=p.p;u.prp.push(p.e+' '+p.n);save();draw();}}function addBp(){db.bp.push({l:parseInt(document.getElementById('in-bl').value)||1,t:document.getElementById('in-bt').value,i:document.getElementById('in-bi').value,x:(parseInt(document.getElementById('in-bl').value)||1)*50});save();draw();}function mine(){let u=db.users[uid],td=new Date().toDateString();if(u.lm===td)return;u.lm=td;u.inv.push(ORES[Math.floor(Math.random()*ORES.length)]);u.x+=25+(u.v===2?25:u.v===1?10:0);save();draw();}function sell(i){let u=db.users[uid];u.b+=u.inv[i].p;u.inv.splice(i,1);save();draw();}function loan(take){let u=db.users[uid];if(take){let v=parseInt(document.getElementById('in-ln').value)||0;if(v>0&&u.d+v<=500){u.d+=v;u.b+=v;}}else if(u.b>=u.d){u.b-=u.d;u.d=0;}save();draw();}function toggleTest(){tst=!tst;db.raim=tst?'x':uid;draw();}function wipeAll(){let m=db.users[uid];db.users={[uid]:m};save();draw();}window.Telegram?.WebApp?.ready();sync().then(draw);setInterval(sync,10000);</script></body></html>
