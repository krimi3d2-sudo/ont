<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ОНТ</title>
<script src="https://telegram.org"></script>
<style>
:root{--bg:#0f172a;--card:#1e293b;--txt:#f8fafc;--mut:#94a3b8;--grad:linear-gradient(135deg,#e2c9a6,#38bdf8,#a855f7)}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
body{background:var(--bg);color:var(--txt);padding:12px 12px 70px;min-height:100vh}
.logo{font-size:28px;font-weight:900;text-align:center;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:8px 0 14px;letter-spacing:1px}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;border:1px solid rgba(255,255,255,.08)}
input,textarea,select{width:100%;padding:11px;margin:6px 0;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:var(--bg);color:var(--txt);font-size:14px}
button{width:100%;padding:12px;border:none;border-radius:12px;font-weight:700;font-size:14px;cursor:pointer;margin-top:6px}
.b-gta{background:var(--grad);color:#0f172a}
.b-sec{background:rgba(255,255,255,.1);color:var(--txt)}
.b-red{background:#ef4444;color:#fff}
.b-sm{padding:6px 10px;font-size:12px;width:auto}
.nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin-bottom:10px}
.nav::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;width:auto;padding:8px 14px;border-radius:20px;background:var(--card);color:var(--mut);font-size:13px}
.tab.act{background:var(--grad);color:#0f172a}
.ava{width:60px;height:60px;border-radius:50%;object-fit:cover;border:2px solid #38bdf8}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;margin:2px}
.pill{display:inline-block;background:var(--bg);padding:5px 9px;border-radius:8px;margin:3px;font-size:12px;border:1px solid rgba(255,255,255,.1)}
.flag{width:52px;height:34px;border-radius:6px;overflow:hidden;position:relative;display:flex;flex-direction:column;border:1px solid rgba(255,255,255,.2)}
.flag div{flex:1}
.flag span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px}
.err{color:#f87171;font-size:13px;text-align:center;margin:6px 0;font-weight:600}
.mod{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;padding:16px;z-index:99}
.mod-in{background:var(--card);border-radius:16px;padding:16px;width:100%;max-width:380px}
</style>
</head>
<body>

<div id="authBox">
  <div class="logo">ОНТ RP</div>
  <div class="card">
    <div style="display:flex;gap:8px;margin-bottom:8px">
      <button id="mLog" class="b-gta" onclick="setMode('login')">Вход</button>
      <button id="mReg" class="b-sec" onclick="setMode('reg')">Регистрация</button>
    </div>
    <input id="fNick" placeholder="Ник (1–32 символа)" autocomplete="off">
    <input id="fUser" placeholder="Username (до 12 симв. или -)" autocomplete="off">
    <input id="fPass" type="password" placeholder="Пароль (8–15 символов)" autocomplete="new-password">
    <div id="aErr" class="err"></div>
    <button class="b-gta" onclick="doAuth()">Продолжить</button>
  </div>
</div>

<div id="appBox" style="display:none">
  <div class="nav" id="nav"></div>
  <div id="view"></div>
</div>

<div id="mod" class="mod" onclick="if(event.target===this)closeM()">
  <div class="mod-in" id="modIn"></div>
</div>

<script>
const DB_HOST = 'ontrp-2ae3b-default-rtdb.europe-west1.firebasedatabase.app';
const DB_URL = 'https://' + DB_HOST + '/ont_rp.json';
const KEY = 'R9m#kL8$vP2@xQ7!zW4&nB6*cM5^jH';

let db = {users:{},apps:{},news:[],events:[],rules:[],market:[],bp:[],flag:{top:'#e2c9a6',mid:'#38bdf8',bot:'#a855f7',icon:'👑'},chat:''};
let uid = localStorage.getItem('ont_u') || null;
let mode = 'login', tab = 'prof', staffOk = false, testMode = false, taps = 0, tapT = null;

if(window.Telegram && Telegram.WebApp){Telegram.WebApp.ready();Telegram.WebApp.expand();}

async function load(){
  try{const c=localStorage.getItem('ont_b');if(c)db=Object.assign(db,JSON.parse(c));}catch(e){}
  try{const r=await fetch(DB_URL);const d=await r.json();if(d&&typeof d==='object'){db=Object.assign(db,d);if(!db.users)db.users={};localStorage.setItem('ont_b',JSON.stringify(db));}}catch(e){}
}
async function save(){
  localStorage.setItem('ont_b',JSON.stringify(db));
  try{await fetch(DB_URL,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(db)});}catch(e){}
}

document.body.addEventListener('click',e=>{
  if(['INPUT','TEXTAREA','SELECT','BUTTON','A'].includes(e.target.tagName))return;
  taps++;clearTimeout(tapT);tapT=setTimeout(()=>taps=0,700);
  if(taps>=3){taps=0;openM(`<h3>🔑 Ключ Владельца</h3><input id="kIn" type="password" placeholder="30-значный ключ"><div id="kErr" class="err"></div><button class="b-gta" onclick="checkKey()">Активировать</button><button class="b-sec" onclick="closeM()">Отмена</button>`);}
});

function checkKey(){
  if(document.getElementById('kIn').value.trim()!==KEY)return document.getElementById('kErr').textContent='Неверный ключ!';
  closeM();
  if(uid&&db.users[uid]){db.users[uid].isRaim=true;db.users[uid].nick='Райм';save();render();}
  else{localStorage.setItem('ont_r','1');msg('Ключ принят! Войдите или зарегистрируйтесь.');}
}

function setMode(m){
  mode=m;
  document.getElementById('mLog').className=m==='login'?'b-gta':'b-sec';
  document.getElementById('mReg').className=m==='reg'?'b-gta':'b-sec';
  document.getElementById('aErr').textContent='';
}

async function doAuth(){
  const err=document.getElementById('aErr');err.textContent='';
  let nick=document.getElementById('fNick').value.trim();
  const user=document.getElementById('fUser').value.trim();
  const pass=document.getElementById('fPass').value;
  if(nick.length<1||nick.length>32)return err.textContent='Ник: от 1 до 32 символов.';
  if(user!=='-'&&!/^[a-zA-Z0-9_]{1,12}$/.test(user))return err.textContent='Username: до 12 англ. букв/цифр/_ или -';
  if(pass.length<8||pass.length>15)return err.textContent='Пароль: от 8 до 15 символов.';
  await load();
  const isR=localStorage.getItem('ont_r')==='1';
  if(nick.toLowerCase()==='raim'&&!isR)nick='Житель ОНТ';
  const id='u_'+user.toLowerCase()+'_'+nick.toLowerCase().replace(/\s+/g,'');
  if(mode==='reg'){
    if(db.users[id])return err.textContent='Аккаунт уже существует. Нажмите «Вход».';
    db.users[id]={nick,username:user,pass,bal:0,xp:0,vip:0,paidBp:false,roles:[],awards:[],items:[],isRaim:isR,cit:isR,ban:false};
    await save();
  }else{
    const u=db.users[id];
    if(!u||u.pass!==pass)return err.textContent='Неверный ник, username или пароль.';
    if(u.ban&&!u.isRaim)return err.textContent='Ваш аккаунт заблокирован.';
    if(isR){u.isRaim=true;u.nick='Райм';await save();}
  }
  uid=id;localStorage.setItem('ont_u',id);boot();
}
function logout(){uid=null;staffOk=false;testMode=false;localStorage.removeItem('ont_u');document.getElementById('appBox').style.display='none';document.getElementById('authBox').style.display='block';}

const TABS=[['prof','👤 Профиль'],['news','📰 Новости'],['ev','🎉 Эвенты'],['mk','🛒 Рынок'],['bp','🎫 BP'],['mine','⛏ Шахта'],['bank','🏦 Банк'],['top','🏆 Топ'],['rule','📜 Правила'],['role','🎭 Роли']];

async function boot(){
  await load();if(!uid||!db.users[uid])return logout();
  document.getElementById('authBox').style.display='none';document.getElementById('appBox').style.display='block';
  render();
}

function render(){
  const me=db.users[uid];if(!me)return logout();
  const raim=me.isRaim&&!testMode;
  document.getElementById('nav').innerHTML=TABS.map(([id,n])=>`<button class="tab ${tab===id?'act':''}" onclick="tab='${id}';render()">${n}</button>`).join('');
  const f=db.flag||{top:'#e2c9a6',mid:'#38bdf8',bot:'#a855f7',icon:'👑'};
  const flg=`<div class="flag"><div style="background:${f.top}"></div><div style="background:${f.mid}"></div><div style="background:${f.bot}"></div><span>${f.icon}</span></div>`;
  let h='';

  if(tab==='prof'){
    const bdg=(me.isRaim?'<span class="tag b-gta">ВЛАДЕЛЕЦ</span>':'')+(me.vip===2?'<span class="tag" style="background:#a855f733;color:#a855f7">VIP 2</span>':me.vip===1?'<span class="tag" style="background:#38bdf833;color:#38bdf8">VIP 1</span>':'')+(me.roles||[]).map(r=>`<span class="tag" style="background:#e2c9a622;color:#e2c9a6">${esc(r)}</span>`).join('');
    const aw=(me.awards||[]).map((a,i)=>`<span class="pill" onclick="showAw('${uid}',${i})">${a.e} ${esc(a.t)}</span>`).join('')||'<span style="color:var(--mut);font-size:13px">Нет наград</span>';
    const it=(me.items||[]).map(x=>`<span class="pill">${x.e} ${esc(x.n)}</span>`).join('')||'<span style="color:var(--mut);font-size:13px">Нет имущества</span>';
    let cit='';
    if(me.cit||me.isRaim)cit=`<div style="color:#34d399;font-size:13px;font-weight:700">✅ Гражданин ОНТ</div>`+(db.chat?`<a href="${db.chat}" target="_blank" style="text-decoration:none"><button class="b-gta">💬 Закрытый чат ОНТ</button></a>`:'');
    else if(db.apps&&db.apps[uid]==='p')cit=`<div style="color:#e2c9a6;font-size:13px">⏳ Заявка на рассмотрении</div>`;
    else cit=`<button class="b-sec" onclick="db.apps[uid]='p';save();render()">🛂 Подать заявку на гражданство</button>`;

    h=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><span style="font-size:11px;color:var(--mut)">СТРАНА ОНТ</span>${flg}</div>
    <div style="display:flex;gap:12px;align-items:center"><img src="${me.photo||'https://placeholder.com'}" class="ava"><div><div style="font-size:18px;font-weight:800">${esc(me.nick)}</div><div style="color:#38bdf8;font-size:13px">${me.username!=='-'?'@'+esc(me.username):'Без username'}</div><div>${bdg}</div></div></div>
    <div style="display:flex;justify-content:space-between;margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.08)"><div><div style="font-size:11px;color:var(--mut)">Баланс</div><div style="font-size:20px;font-weight:800;color:#e2c9a6">${me.bal||0} ß</div></div><div style="text-align:right"><div style="font-size:11px;color:var(--mut)">Battle Pass</div><div style="font-weight:700">Ур. ${Math.floor((me.xp||0)/100)+1} (${me.xp||0} XP) ${me.paidBp?'🌟':''}</div></div></div><div style="margin-top:10px">${cit}</div></div>
    <div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><b>🏅 Награды</b><button class="b-sec b-sm" onclick="me.hideAw=!me.hideAw;save();render()">${me.hideAw?'👁 Показать':'🙈 Скрыть'}</button></div><div style="margin-top:6px">${aw}</div></div>
    <div class="card"><b>🏠 Имущество</b><div style="margin-top:6px">${it}</div></div>
    <div class="card"><b>⚙️ Настройки</b><button class="b-sec" onclick="linkTg()">📲 Подключить профиль Telegram</button>${me.tgId?`<div style="font-size:12px;color:#34d399;margin-top:4px">TG ID: ${me.tgId}</div>`:''}<button class="b-red" onclick="logout()">🚪 Выйти из аккаунта</button></div>`;
  }

  if(tab==='news'){
    if(raim||(me.roles||[]).some(r=>r.toLowerCase().includes('админ')))h+=`<div class="card"><b>✍️ Новость</b><input id="nT" placeholder="Заголовок"><textarea id="nB" rows="2" placeholder="Текст"></textarea><button class="b-gta" onclick="addN()">Опубликовать</button></div>`;
    h+=(db.news||[]).slice().reverse().map(n=>`<div class="card"><b style="color:#38bdf8">${esc(n.t)}</b><div style="margin:6px 0;font-size:14px">${esc(n.b)}</div><div style="font-size:11px;color:var(--mut)">${esc(n.a)} • ${n.d}</div></div>`).join('')||'<div class="card">Новостей нет.</div>';
  }
  if(tab==='ev'){
    if(raim)h+=`<div class="card"><b>📅 Новый эвент</b><input id="eT" placeholder="Название"><input id="eW" placeholder="Время"><input id="eD" placeholder="Описание"><button class="b-gta" onclick="addE()">Создать</button></div>`;
    h+=(db.events||[]).slice().reverse().map((e,i)=>{const idx=db.events.length-1-i,j=(e.p||[]).includes(uid);return`<div class="card"><b style="color:#a855f7">${esc(e.t)}</b><div style="font-size:12px;color:#e2c9a6">⏰ ${esc(e.w)}</div><div style="margin:6px 0;font-size:14px">${esc(e.d)}</div><div style="font-size:12px;color:var(--mut)">Участников: ${(e.p||[]).length}</div><button class="${j?'b-sec':'b-gta'}" onclick="joinE(${idx})">${j?'✅ Вы участвуете':'🙋‍♂️ Участвовать'}</button></div>`;}).join('')||'<div class="card">Эвентов нет.</div>';
  }

  if(tab==='mk'){
    if(raim)h+=`<div class="card"><b>➕ Товар на рынок</b><select id="mC"><option>Машина</option><option>Дом</option><option>Бизнес</option><option>Другое</option></select><input id="mE" placeholder="Эмодзи"><input id="mN" placeholder="Название"><input id="mP" type="number" placeholder="Цена ß"><button class="b-gta" onclick="addM()">Добавить</button></div>`;
    h+=(db.market||[]).map((x,i)=>`<div class="card" style="display:flex;justify-content:space-between;align-items:center"><div><span style="font-size:11px;color:#38bdf8">${esc(x.c)}</span><div><b>${x.e} ${esc(x.n)}</b></div><div style="color:#e2c9a6">${x.p} ß</div></div><button class="b-gta b-sm" onclick="buyM(${i})">Купить</button></div>`).join('')||'<div class="card">Рынок пуст.</div>';
  }

  if(tab==='bp'){
    if(raim||(me.roles||[]).includes('Заполнитель Battle Pass'))h+=`<div class="card"><b>🎫 Уровень BP</b><input id="bL" type="number" placeholder="Номер уровня"><input id="bF" placeholder="Бесплатная награда"><input id="bP" placeholder="Платная награда"><button class="b-gta" onclick="addB()">Добавить</button></div>`;
    const lv=Math.floor((me.xp||0)/100)+1;
    h+=`<div class="card"><b>Ваш уровень: ${lv}</b> (${me.xp||0} XP) • ${me.paidBp?'🌟 Платный BP':'Обычный BP'}</div>`+(db.bp||[]).sort((a,b)=>a.l-b.l).map(x=>`<div class="card" style="opacity:${lv>=x.l?1:.6}"><b style="color:#38bdf8">Уровень ${x.l} ${lv>=x.l?'✅':'🔒'}</b><div style="font-size:13px">🆓 ${esc(x.f)}</div><div style="font-size:13px;color:#e2c9a6">🌟 ${esc(x.p)}</div></div>`).join('');
  }

  if(tab==='mine'){
    const td=new Date().toISOString().slice(0,10),done=me.lastM===td,o=me.ores||{c:0,i:0,g:0,d:0};
    h+=`<div class="card"><b>⛏ Шахта (1 раз в день)</b><p style="font-size:12px;color:var(--mut);margin:6px 0">VIP 1: +10 XP, VIP 2: +25 XP</p><button class="b-gta" onclick="mine()" ${done?'disabled style="opacity:.5"':''}>${done?'⏳ Уже копали сегодня':'⛏ Копать руду'}</button></div>
    <div class="card"><b>🎒 Рюкзак</b><div style="font-size:14px;line-height:1.7;margin:6px 0">🪨 Уголь: ${o.c||0} (10 ß)<br>⛓ Железо: ${o.i||0} (25 ß)<br>🪙 Золото: ${o.g||0} (50 ß)<br>💎 Алмаз: ${o.d||0} (120 ß)</div><button class="b-sec" onclick="sellO()">💰 Продать руду</button></div>`;
  }

  if(tab==='bank'){
    const d=me.debt||0;
    h+=`<div class="card"><b>🏦 Банк (Кредит до 500 ß)</b><div style="margin:8px 0">Текущий долг: <b style="color:#f87171">${d} ß</b></div><input id="lIn" type="number" placeholder="Сумма"><button class="b-gta" onclick="loan()">Взять кредит</button>${d>0?`<button class="b-sec" onclick="repay()">💸 Погасить (${d} ß)</button>`:''}</div>`;
  }

  if(tab==='top'){
    const arr=Object.entries(db.users||{}).sort((a,b)=>(b.bal||0)-(a.bal||0));
    const sum=arr.reduce((s,[,u])=>s+(u.bal||0),0);
    h+=`<div class="card" style="text-align:center"><div style="font-size:11px;color:var(--mut)">ОБЩАЯ КАЗНА ОНТ</div><div style="font-size:22px;font-weight:800;color:#e2c9a6">${sum} ß</div></div>`+arr.map(([id,u],i)=>`<div class="card" style="display:flex;justify-content:space-between;cursor:pointer" onclick="openU('${id}')"><b>${i===0?'🥇':i===1?'🥈':i===2?'🥉':'#'+(i+1)} ${esc(u.nick)}</b><b style="color:#38bdf8">${u.bal||0} ß</b></div>`).join('');
  }

  if(tab==='rule'){
    if(raim)h+=`<div class="card"><b>📜 Новое правило</b><input id="rN" placeholder="Пункт (1.1)"><input id="rT" placeholder="Текст"><button class="b-gta" onclick="addR()">Добавить</button></div>`;
    h+=(db.rules||[]).map(r=>`<div class="card"><b style="color:#e2c9a6">Пункт ${esc(r.n)}</b><div style="font-size:14px;margin-top:4px">${esc(r.t)}</div></div>`).join('')||'<div class="card">Правил нет.</div>';
  }

  if(tab==='role')h+=`<div class="card"><b>👑 Роли и VIP</b><p style="font-size:13px;line-height:1.6;margin-top:6px">💎 <b>VIP 1:</b> Голубой тег, +10 XP в шахте.<br>🔮 <b>VIP 2:</b> Фиолетовый тег, +25 XP в шахте.<br>🎫 <b>Заполнитель BP:</b> Наполнение веток BP.<br>🏥 <b>Санитар Наград:</b> Выдача наград.<br>🛡 <b>Модераторы / ⚡ Администраторы:</b> Новости и блокировки.</p></div>`;

  if((me.roles||[]).length&&!testMode)h+=staffBox(me);
  if(me.isRaim)h+=raimBox();
  document.getElementById('view').innerHTML=h;
}
function staffBox(me){
  if(!me.sPass)return'<div class="card" style="border-color:#38bdf8"><b>🔐 Задайте пароль сотрудника</b><input id="sp1" type="password" placeholder="Новый пароль"><button class="b-gta" onclick="setSp()">Сохранить</button></div>';
  if(!staffOk)return'<div class="card" style="border-color:#38bdf8"><b>🔐 Вход в панель персонала</b><input id="sp2" type="password" placeholder="Пароль"><button class="b-gta" onclick="chkSp()">Войти</button></div>';
  const opts=Object.entries(db.users).filter(([,u])=>!u.isRaim).map(([k,u])=>'<option value="'+k+'">'+esc(u.nick)+'</option>').join('');
  let s='<div class="card" style="border-color:#38bdf8"><b>🛠 Панель персонала</b>';
  if(me.roles.includes('Санитар Наград'))s+='<select id="awU">'+opts+'</select><input id="awE" placeholder="Эмодзи"><input id="awT" placeholder="Название"><input id="awD" placeholder="Описание"><button class="b-gta" onclick="giveAw()">Выдать награду</button>';
  if(me.roles.some(r=>r.toLowerCase().includes('админ')))s+='<select id="bnU">'+opts+'</select><button class="b-red" onclick="banU()">Блок / Разблок</button>';
  return s+'</div>';
}

function raimBox(){
  if(testMode)return`<div class="card"><button class="b-gta" onclick="testMode=false;render()">👁 Выйти из режима «Тест как игрок»</button></div>`;
  const opts=Object.entries(db.users).map(([k,u])=>`<option value="${k}">${esc(u.nick)} (${u.bal||0} ß)</option>`).join('');
  const apps=Object.entries(db.apps||{}).filter(([,v])=>v==='p').map(([k])=>db.users[k]?`<div style="display:flex;justify-content:space-between;align-items:center;margin:5px 0"><span>${esc(db.users[k].nick)}</span><div><button class="b-gta b-sm" onclick="appRes('${k}',1)">✅</button> <button class="b-red b-sm" onclick="appRes('${k}',0)">❌</button></div></div>`:'').join('')||'<div style="font-size:12px;color:var(--mut)">Нет заявок</div>';
  const f=db.flag||{top:'#e2c9a6',mid:'#38bdf8',bot:'#a855f7',icon:'👑'};
  return`<div class="card" style="border:2px solid #a855f7"><b style="color:#e2c9a6">👑 Панель Владельца (Райм)</b>
  <div style="margin-top:8px"><b>🛂 Заявки на гражданство:</b>${apps}</div>
  <div style="margin-top:10px"><b>💰 Баланс (ß):</b><select id="bU">${opts}</select><input id="bA" type="number" placeholder="Сумма"><div style="display:flex;gap:5px"><button class="b-gta b-sm" onclick="modB(1)">+ Выдать</button><button class="b-red b-sm" onclick="modB(-1)">- Забрать</button><button class="b-sec b-sm" onclick="modB(0)">= Задать</button></div></div>
  <div style="margin-top:10px"><b>🎭 Роли / VIP / BP:</b><select id="rU">${opts}</select><select id="rS"><option value="VIP1">VIP 1</option><option value="VIP2">VIP 2</option><option value="BP">Платный BP</option><option>Заполнитель Battle Pass</option><option>Санитар Наград</option><option>Младший модератор</option><option>Старший модератор</option><option>Младший администратор</option><option>Администратор</option><option>Старший администратор</option></select><div style="display:flex;gap:5px"><button class="b-gta b-sm" onclick="modR(1)">Выдать</button><button class="b-red b-sm" onclick="modR(0)">Снять</button><button class="b-sec b-sm" onclick="rstSp()">Сброс пароля</button></div></div>
  <div style="margin-top:10px"><b>🏳️ Флаг ОНТ:</b><div style="display:flex;gap:5px"><input type="color" id="c1" value="${f.top}"><input type="color" id="c2" value="${f.mid}"><input type="color" id="c3" value="${f.bot}"><input id="cI" value="${f.icon}" style="width:60px"></div><button class="b-sec b-sm" onclick="svF()">Сохранить флаг</button></div>
  <div style="margin-top:10px"><b>🔗 Закрытый чат:</b><input id="chIn" value="${db.chat||''}" placeholder="https://t.me+..."><div style="display:flex;gap:5px"><button class="b-gta b-sm" onclick="db.chat=document.getElementById('chIn').value.trim();save();render()">Привязать</button><button class="b-red b-sm" onclick="db.chat='';save();render()">Отвязать</button></div></div>
  <button class="b-sec" style="margin-top:10px" onclick="testMode=true;render()">👁 Тест как игрок</button><button class="b-red" onclick="wipe()">⚠️ Удалить чужие аккаунты</button></div>`;
}

function linkTg(){const u=window.Telegram?.WebApp?.initDataUnsafe?.user;if(!u)return msg('Откройте в Telegram.');db.users[uid].tgId=u.id;if(u.photo_url)db.users[uid].photo=u.photo_url;if(u.username&&db.users[uid].username==='-')db.users[uid].username=u.username.slice(0,12);save();render();}
function appRes(k,ok){if(ok){db.apps[k]='ok';db.users[k].cit=true;db.users[k].awards=db.users[k].awards||[];db.users[k].awards.push({e:'🛂',t:'Паспорт ОНТ',d:'Гражданин ОНТ',dt:new Date().toLocaleDateString('ru-RU'),by:'Райм'});}else delete db.apps[k];save();render();}
function addN(){const t=document.getElementById('nT').value.trim(),b=document.getElementById('nB').value.trim();if(t&&b){db.news.push({t,b,a:db.users[uid].nick,d:new Date().toLocaleString('ru-RU')});save();render();}}
function addE(){const t=document.getElementById('eT').value.trim(),w=document.getElementById('eW').value.trim(),d=document.getElementById('eD').value.trim();if(t&&w){db.events.push({t,w,d,p:[]});save();render();}}
function joinE(i){const e=db.events[i];e.p=e.p||[];if(!e.p.includes(uid)){e.p.push(uid);save();render();}}
function addM(){const c=document.getElementById('mC').value,e=document.getElementById('mE').value.trim()||'📦',n=document.getElementById('mN').value.trim(),p=+document.getElementById('mP').value;if(n&&p>=0){db.market.push({c,e,n,p});save();render();}}
function buyM(i){const x=db.market[i],me=db.users[uid];if((me.bal||0)<x.p)return msg('Недостаточно ß!');me.bal-=x.p;me.items=me.items||[];me.items.push(x);save();render();msg('Куплено: '+x.n);}
function addB(){const l=+document.getElementById('bL').value,f=document.getElementById('bF').value.trim(),p=document.getElementById('bP').value.trim()||'—';if(l&&f){db.bp.push({l,f,p});save();render();}}
function mine(){const me=db.users[uid],td=new Date().toISOString().slice(0,10);if(me.lastM===td)return;const r=Math.random(),k=r>.92?'d':r>.75?'g':r>.45?'i':'c',nm={c:'🪨 Уголь',i:'⛓ Железо',g:'🪙 Золото',d:'💎 Алмаз'}[k];me.ores=me.ores||{c:0,i:0,g:0,d:0};me.ores[k]++;const xp=20+(me.vip===2?25:me.vip===1?10:0);me.xp=(me.xp||0)+xp;me.lastM=td;save();render();msg('Добыто: '+nm+' (+'+xp+' XP)');}
function sellO(){const me=db.users[uid],o=me.ores||{},s=(o.c||0)*10+(o.i||0)*25+(o.g||0)*50+(o.d||0)*120;if(!s)return msg('Нет руды.');me.ores={c:0,i:0,g:0,d:0};me.bal=(me.bal||0)+s;save();render();msg('Продано за '+s+' ß!');}
function loan(){const me=db.users[uid],d=me.debt||0,a=+document.getElementById('lIn').value;if(a>0&&d+a<=500){me.debt=d+a;me.bal=(me.bal||0)+a;save();render();}else msg('Лимит долга 500 ß.');}
function repay(){const me=db.users[uid],d=me.debt||0;if((me.bal||0)<d)return msg('Недостаточно ß.');me.bal-=d;me.debt=0;save();render();}
function addR(){const n=document.getElementById('rN').value.trim(),t=document.getElementById('rT').value.trim();if(n&&t){db.rules.push({n,t});save();render();}}
function setSp(){const p=document.getElementById('sp1').value.trim();if(p.length>=4){db.users[uid].sPass=p;staffOk=true;save();render();}}
function chkSp(){if(document.getElementById('sp2').value===db.users[uid].sPass){staffOk=true;render();}else msg('Неверный пароль!');}
function giveAw(){const k=document.getElementById('awU').value,e=document.getElementById('awE').value.trim()||'🏅',t=document.getElementById('awT').value.trim(),d=document.getElementById('awD').value.trim();if(k&&t&&!db.users[k].isRaim){db.users[k].awards=db.users[k].awards||[];db.users[k].awards.push({e,t,d,dt:new Date().toLocaleDateString('ru-RU'),by:db.users[uid].nick});save();msg('Награда выдана!');}}
function banU(){const k=document.getElementById('bnU').value;if(k&&!db.users[k].isRaim){db.users[k].ban=!db.users[k].ban;save();msg(db.users[k].ban?'Заблокирован.':'Разблокирован.');}}
function modB(m){const k=document.getElementById('bU').value,a=+document.getElementById('bA').value;if(!k||isNaN(a))return;const c=db.users[k].bal||0;db.users[k].bal=m===1?c+a:m===-1?Math.max(0,c-a):Math.max(0,a);save();render();}
function modR(g){const k=document.getElementById('rU').value,v=document.getElementById('rS').value,u=db.users[k];if(!u)return;if(v==='VIP1')u.vip=g?1:0;else if(v==='VIP2')u.vip=g?2:0;else if(v==='BP')u.paidBp=!!g;else{u.roles=u.roles||[];if(g&&!u.roles.includes(v))u.roles.push(v);if(!g)u.roles=u.roles.filter(r=>r!==v);}save();render();}
function rstSp(){const k=document.getElementById('rU').value;if(db.users[k]){delete db.users[k].sPass;save();msg('Пароль сброшен.');}}
function svF(){db.flag={top:document.getElementById('c1').value,mid:document.getElementById('c2').value,bot:document.getElementById('c3').value,icon:document.getElementById('cI').value.trim()||'👑'};save();render();}
function wipe(){Object.keys(db.users).forEach(k=>{if(!db.users[k].isRaim)delete db.users[k];});db.apps={};save();render();msg('Аккаунты удалены.');}

function openU(k){const u=db.users[k];if(!u)return;const aw=u.hideAw?'<i>Скрыто</i>':((u.awards||[]).map((a,i)=>'<span class="pill" onclick="showAw(\''+k+'\','+i+')">'+a.e+' '+esc(a.t)+'</span>').join('')||'Нет');openM('<div style="text-align:center"><img src="'+(u.photo||'https://placeholder.com')+'" class="ava"><h3>'+esc(u.nick)+'</h3><div style="color:#38bdf8;font-size:13px">'+(u.username!=='-'?'@'+esc(u.username):'')+'</div></div><div style="margin-top:10px;font-size:13px;line-height:1.7"><b>Баланс:</b> '+(u.bal||0)+' ß<br><b>VIP:</b> '+(u.vip?'VIP '+u.vip:'Нет')+'<br><b>Роли:</b> '+esc((u.roles||[]).join(', ')||'Житель')+'<br><b>Имущество:</b> '+((u.items||[]).map(x=>x.e+' '+esc(x.n)).join(', ')||'Нет')+'<br><b>Награды:</b><br>'+aw+'</div><button class="b-sec" onclick="closeM()">Закрыть</button>');}
function showAw(k,i){const a=db.users[k]?.awards?.[i];if(a)openM('<div style="text-align:center;font-size:36px">'+a.e+'</div><h3 style="text-align:center">'+esc(a.t)+'</h3><p style="margin:8px 0;font-size:14px">'+esc(a.d||'')+'</p><div style="font-size:12px;color:var(--mut)">Выдал: '+esc(a.by)+' • '+a.dt+'</div><button class="b-sec" onclick="closeM()">Закрыть</button>');}
function msg(t){openM('<p style="text-align:center;margin:10px 0">'+esc(t)+'</p><button class="b-gta" onclick="closeM()">ОК</button>');}
function openM(h){document.getElementById('modIn').innerHTML=h;document.getElementById('mod').style.display='flex';}
function closeM(){document.getElementById('mod').style.display='none';}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

if(uid)boot();
</script>
</body>
</html>
